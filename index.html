<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M GARAGE — RACING DIVISION</title>
  <style>
    :root {
      --bg: #050507;
      --panel: #0c0d11;
      --panel-2: #13151c;
      --line: rgba(255, 255, 255, 0.12);
      --line-red: rgba(239, 35, 60, 0.55);
      --text: #f8fafc;
      --muted: #9ca3af;
      --red: #d90429;
      --red-bright: #ef233c;
      --ok: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Admin Top Bar */
    .admin-top-panel {
      display: none;
      padding: 12px 14px 14px;
      background: linear-gradient(180deg, rgba(180, 10, 30, 0.28) 0%, rgba(10, 6, 8, 0.96) 100%);
      border-bottom: 1px solid var(--line-red);
    }

    .admin-top-panel.active {
      display: block;
    }

    .admin-status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #ffccd5;
    }

    .admin-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-bright);
      box-shadow: 0 0 8px var(--red-bright);
      margin-right: 6px;
    }

    .admin-btn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .adm-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #14161f;
      color: #f3f4f6;
      padding: 8px 11px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 4px;
      cursor: pointer;
    }

    .adm-btn:hover {
      border-color: rgba(255, 255, 255, 0.35);
      background: #1c202c;
    }

    .adm-btn.red {
      background: linear-gradient(180deg, #e11d48 0%, #9f1239 100%);
      border-color: #fb7185;
      color: #fff;
      box-shadow: 0 2px 12px rgba(225, 29, 72, 0.35);
    }

    /* Main Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(5, 5, 7, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-emblem {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--red-bright);
      background: radial-gradient(circle at 35% 30%, #24070d, #070709 72%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(239, 35, 60, 0.35);
    }

    .header-emblem svg {
      width: 24px;
      height: 24px;
    }

    .header-titles {
      min-width: 0;
    }

    .header-name {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    .header-sub {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .cloud-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 5px 7px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .cloud-badge.live {
      color: var(--ok);
      border-color: rgba(34, 197, 94, 0.4);
    }

    .btn-sync {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-admin-pill {
      appearance: none;
      border: 1px solid #ff6b81;
      background: linear-gradient(180deg, #ef233c 0%, #b50724 100%);
      color: #fff;
      padding: 7px 11px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(239, 35, 60, 0.4);
    }

    /* Center Hero */
    .hero-stage {
      position: relative;
      padding: 44px 18px 36px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 24%, rgba(217, 4, 41, 0.22) 0%, rgba(217, 4, 41, 0.04) 38%, rgba(5, 5, 7, 0) 70%),
        var(--bg);
      background-size: cover;
      background-position: center;
    }

    .hero-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 5, 7, 0.42) 0%, rgba(5, 5, 7, 0.84) 100%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
    }

    .hero-logo-ring {
      width: 156px;
      height: 156px;
      margin: 0 auto 22px;
      border-radius: 50%;
      padding: 6px;
      background: conic-gradient(from 0deg, #ff2a4b, #690314, #ff2a4b, #4a020e, #ff2a4b);
      box-shadow:
        0 0 36px rgba(239, 35, 60, 0.42),
        inset 0 0 18px rgba(0, 0, 0, 0.9);
    }

    .hero-logo-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1d060b 0%, #070709 75%);
      border: 2px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-core svg {
      width: 112px;
      height: 112px;
    }

    .hero-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.24em;
      color: var(--red-bright);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero-headline {
      margin: 0;
      font-size: clamp(24px, 6.2vw, 38px);
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1.18;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
    }

    .hero-caption {
      margin: 14px auto 0;
      max-width: 500px;
      font-size: 12.5px;
      line-height: 1.75;
      color: #cbd5e1;
    }

    /* Content Sections */
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 14px 32px;
    }

    .block {
      margin-top: 32px;
    }

    .block:first-child {
      margin-top: 0;
    }

    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .block-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.14em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .block-title::before {
      content: "";
      width: 4px;
      height: 15px;
      background: var(--red-bright);
      box-shadow: 0 0 8px rgba(239, 35, 60, 0.7);
    }

    .vehicle-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .v-pill {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      white-space: nowrap;
      cursor: pointer;
    }

    .v-pill.active {
      background: linear-gradient(180deg, rgba(217, 4, 41, 0.25) 0%, var(--panel-2) 100%);
      color: #fff;
      border-color: var(--red-bright);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 14px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #07080b;
      display: block;
      border-bottom: 1px solid var(--line);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-meta {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .card-desc {
      margin: 0;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.55;
    }

    .card-price {
      margin-top: auto;
      padding-top: 8px;
      font-size: 14px;
      font-weight: 900;
      color: #ff4d6d;
      letter-spacing: 0.04em;
    }

    .card-ops {
      display: none;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    body.is-admin .card-ops {
      display: flex;
    }

    .empty-state {
      padding: 28px 16px;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      background: rgba(12, 13, 17, 0.7);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* Footer with Creator Credit */
    .site-footer {
      border-top: 1px solid var(--line);
      background: #040406;
      padding: 20px 14px 36px;
      text-align: center;
    }

    .creator-credit {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #e2e8f0;
      padding: 6px 14px;
      border: 1px solid rgba(239, 35, 60, 0.35);
      background: rgba(217, 4, 41, 0.08);
      border-radius: 4px;
    }

    /* Modals */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.82);
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-heading {
      margin: 0 0 14px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.1em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 9px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <!-- Admin Ribbon -->
  <div id="adminPanel" class="admin-top-panel">
    <div class="admin-status-line">
      <span><span class="admin-dot"></span>ADMIN MODE UNLOCKED</span>
      <span id="adminSyncHint">CLOUD READY</span>
    </div>
    <div class="admin-btn-grid">
      <button id="btnAddCar" class="adm-btn red" type="button">+ デモカーをアップ</button>
      <button id="btnAddVehicle" class="adm-btn red" type="button">+ 車種を追加・管理</button>
      <button id="btnAddAero" class="adm-btn red" type="button">+ エアロをアップ</button>
      <button id="btnEditHero" class="adm-btn" type="button">トップ文言・背景</button>
      <button id="btnChangePass" class="adm-btn" type="button">パスワード変更</button>
      <button id="btnLock" class="adm-btn" type="button">ロック</button>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-brand">
      <div class="header-emblem" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="28" fill="none" stroke="#ef233c" stroke-width="3.5" />
          <path d="M14 42 L22 20 L32 34 L42 20 L50 42" fill="none" stroke="#ff4d6d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <text x="32" y="51" text-anchor="middle" fill="#ffffff" font-size="7.5" font-weight="900" letter-spacing="1.2">GARAGE</text>
        </svg>
      </div>
      <div class="header-titles">
        <div class="header-name">M GARAGE</div>
        <div class="header-sub">RACING DIVISION</div>
      </div>
    </div>
    <div class="header-right">
      <span id="syncBadge" class="cloud-badge">SYNC</span>
      <button id="btnRefresh" class="btn-sync" type="button">更新</button>
      <button id="btnAdminOpen" class="btn-admin-pill" type="button">ADMIN</button>
    </div>
  </header>

  <!-- Hero -->
  <section id="heroStage" class="hero-stage">
    <div class="hero-inner">
      <div class="hero-logo-ring">
        <div class="hero-logo-core">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="52" fill="none" stroke="#ef233c" stroke-width="4" />
            <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
            <path d="M24 76 L38 36 L60 64 L82 36 L96 76" fill="none" stroke="#ff2a4b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
            <rect x="26" y="79" width="68" height="15" rx="2" fill="#0b0c10" stroke="#ef233c" stroke-width="1.5" />
            <text x="60" y="90" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="900" letter-spacing="2.2">GARAGE</text>
          </svg>
        </div>
      </div>
      <div id="heroKicker" class="hero-kicker">M GARAGE — RACING DIVISION</div>
      <h1 id="heroTitle" class="hero-headline">PRECISION AERO &amp; TUNING</h1>
      <p id="heroDesc" class="hero-caption">カスタム＆エアロパーツ制作ガレージ。管理人からアップロードされた車両・エアロデータを順次公開します。</p>
    </div>
  </section>

  <!-- Content -->
  <main class="wrap">
    <section class="block">
      <div class="block-head">
        <h2 class="block-title">DEMO CARS</h2>
      </div>
      <div id="carsGrid" class="cards"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2 class="block-title">VEHICLES &amp; AERO PARTS</h2>
      </div>
      <div id="vehicleTabs" class="vehicle-bar"></div>
      <div id="aerosGrid" class="cards"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="creator-credit">サイト作成者　100系師匠</div>
  </footer>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-bg">
    <div class="modal-card">
      <h3 class="modal-heading">ADMIN AUTHENTICATION</h3>
      <div class="field">
        <label for="passInput">パスフレーズ</label>
        <input id="passInput" type="password" autocomplete="current-password" />
      </div>
      <div class="modal-foot">
        <button id="authCancel" class="adm-btn" type="button">キャンセル</button>
        <button id="authSubmit" class="adm-btn red" type="button">解除</button>
      </div>
    </div>
  </div>

  <!-- Form Modal -->
  <div id="formModal" class="modal-bg">
    <div class="modal-card">
      <h3 id="formHeading" class="modal-heading">編集</h3>
      <form id="dynamicForm"></form>
      <div class="modal-foot">
        <button id="formCancel" class="adm-btn" type="button">キャンセル</button>
        <button class="adm-btn red" type="submit" form="dynamicForm">保存して公開</button>
      </div>
    </div>
  </div>

  <script>
    const BIN_ID = '6b044c53ac6210605a9e2e04';
    const API_KEY = '$2a$10$GYiwICH2NkLOcpInHaSOo.9fRprLcSsEdS5.wtcGTP488xFdOWWq6';
    const DEFAULT_PASS = 'M9#kP2vL8xQ4nR7z';
    const CACHE_KEY = 'm_garage_classic_sync_v1';

    let db = {
      cars: [],
      vehicles: [],
      aeros: [],
      hero: {
        kicker: 'M GARAGE — RACING DIVISION',
        title: 'PRECISION AERO & TUNING',
        desc: 'カスタム＆エアロパーツ制作ガレージ。管理人からアップロードされた車両・エアロデータを順次公開します。',
        bgUrl: ''
      },
      passphrase: DEFAULT_PASS
    };

    let selectedVehicleId = null;
    let isAdmin = false;
    let mode = null;
    let editId = null;

    const adminPanel = document.getElementById('adminPanel');
    const syncBadge = document.getElementById('syncBadge');
    const adminSyncHint = document.getElementById('adminSyncHint');
    const carsGrid = document.getElementById('carsGrid');
    const vehicleTabs = document.getElementById('vehicleTabs');
    const aerosGrid = document.getElementById('aerosGrid');

    function setSyncState(text, live = false) {
      syncBadge.textContent = text;
      syncBadge.className = live ? 'cloud-badge live' : 'cloud-badge';
      adminSyncHint.textContent = text;
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        db = {
          cars: Array.isArray(p.cars) ? p.cars : [],
          vehicles: Array.isArray(p.vehicles) ? p.vehicles : [],
          aeros: Array.isArray(p.aeros) ? p.aeros : [],
          hero: { ...db.hero, ...(p.hero || {}) },
          passphrase: p.passphrase || DEFAULT_PASS
        };
      } catch (_) {}
    }

    function writeLocal() {
      localStorage.setItem(CACHE_KEY, JSON.stringify(db));
    }

    async function loadCloud() {
      readLocal();
      renderAll();
      setSyncState('LOADING');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        if (!res.ok) throw new Error();
        const json = await res.json();
        const rec = json.record || {};
        db = {
          cars: Array.isArray(rec.cars) ? rec.cars : [],
          vehicles: Array.isArray(rec.vehicles) ? rec.vehicles : [],
          aeros: Array.isArray(rec.aeros) ? rec.aeros : [],
          hero: { ...db.hero, ...(rec.hero || {}) },
          passphrase: rec.passphrase || db.passphrase || DEFAULT_PASS
        };
        writeLocal();
        renderAll();
        setSyncState('LIVE', true);
      } catch (_) {
        setSyncState('OFFLINE');
      }
    }

    async function saveCloud() {
      writeLocal();
      renderAll();
      setSyncState('PUBLISHING');
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(db)
        });
        if (!res.ok) throw new Error();
        setSyncState('SYNCED', true);
      } catch (_) {
        setSyncState('ERROR');
      }
    }

    function renderHero() {
      document.getElementById('heroKicker').textContent = db.hero.kicker || 'M GARAGE — RACING DIVISION';
      document.getElementById('heroTitle').textContent = db.hero.title || 'PRECISION AERO & TUNING';
      document.getElementById('heroDesc').textContent = db.hero.desc || '';
      const stage = document.getElementById('heroStage');
      if (db.hero.bgUrl) {
        stage.style.backgroundImage = `url("${db.hero.bgUrl.replace(/"/g, '')}")`;
      } else {
        stage.style.backgroundImage = '';
      }
    }

    function renderCars() {
      if (!db.cars.length) {
        carsGrid.innerHTML = '<div class="empty-state">デモカーはまだ登録されていません</div>';
        return;
      }
      carsGrid.innerHTML = db.cars
        .map(
          (c) => `
          <article class="card">
            ${c.image ? `<img class="card-img" src="${esc(c.image)}" alt="${esc(c.name)}" />` : ''}
            <div class="card-body">
              <div class="card-meta">${esc(c.spec || 'DEMO CAR')}</div>
              <h3 class="card-title">${esc(c.name)}</h3>
              ${c.desc ? `<p class="card-desc">${esc(c.desc)}</p>` : ''}
              <div class="card-ops">
                <button class="adm-btn" type="button" onclick="editEntry('car', '${c.id}')">編集</button>
                <button class="adm-btn" type="button" onclick="deleteEntry('car', '${c.id}')">削除</button>
              </div>
            </div>
          </article>`
        )
        .join('');
    }

    function renderAeros() {
      if (!db.vehicles.length) {
        vehicleTabs.innerHTML = '';
        aerosGrid.innerHTML = '<div class="empty-state">車種がまだ登録されていません</div>';
        return;
      }
      if (!selectedVehicleId || !db.vehicles.some((v) => v.id === selectedVehicleId)) {
        selectedVehicleId = db.vehicles[0].id;
      }
      vehicleTabs.innerHTML = db.vehicles
        .map(
          (v) => `
          <button
            type="button"
            class="v-pill ${v.id === selectedVehicleId ? 'active' : ''}"
            onclick="selectVehicle('${v.id}')"
          >
            ${esc(v.maker ? v.maker + ' ' : '')}${esc(v.name)}${v.code ? ' (' + esc(v.code) + ')' : ''}
          </button>`
        )
        .join('');

      const list = db.aeros.filter((a) => a.vehicleId === selectedVehicleId);
      if (!list.length) {
        aerosGrid.innerHTML = '<div class="empty-state">この車種のエアロパーツはまだ登録されていません</div>';
        return;
      }
      aerosGrid.innerHTML = list
        .map(
          (a) => `
          <article class="card">
            ${a.image ? `<img class="card-img" src="${esc(a.image)}" alt="${esc(a.name)}" />` : ''}
            <div class="card-body">
              <div class="card-meta">${esc(a.position || 'AERO')}${a.material ? ' / ' + esc(a.material) : ''}</div>
              <h3 class="card-title">${esc(a.name)}</h3>
              ${a.desc ? `<p class="card-desc">${esc(a.desc)}</p>` : ''}
              ${a.price ? `<div class="card-price">${esc(a.price)}</div>` : ''}
              <div class="card-ops">
                <button class="adm-btn" type="button" onclick="editEntry('aero', '${a.id}')">編集</button>
                <button class="adm-btn" type="button" onclick="deleteEntry('aero', '${a.id}')">削除</button>
              </div>
            </div>
          </article>`
        )
        .join('');
    }

    function renderAll() {
      document.body.classList.toggle('is-admin', isAdmin);
      adminPanel.classList.toggle('active', isAdmin);
      renderHero();
      renderCars();
      renderAeros();
    }

    window.selectVehicle = function (id) {
      selectedVehicleId = id;
      renderAeros();
    };

    // Auth
    const authModal = document.getElementById('authModal');
    const passInput = document.getElementById('passInput');

    document.getElementById('btnAdminOpen').addEventListener('click', () => {
      if (isAdmin) return;
      passInput.value = '';
      authModal.classList.add('open');
      passInput.focus();
    });

    document.getElementById('authCancel').addEventListener('click', () => authModal.classList.remove('open'));
    document.getElementById('authSubmit').addEventListener('click', () => {
      if (passInput.value === (db.passphrase || DEFAULT_PASS)) {
        isAdmin = true;
        authModal.classList.remove('open');
        renderAll();
      } else {
        alert('パスフレーズが違います');
      }
    });

    document.getElementById('btnLock').addEventListener('click', () => {
      isAdmin = false;
      renderAll();
    });

    document.getElementById('btnRefresh').addEventListener('click', loadCloud);

    // Form Modal
    const formModal = document.getElementById('formModal');
    const formHeading = document.getElementById('formHeading');
    const dynamicForm = document.getElementById('dynamicForm');

    function openModal(nextMode, item = null) {
      if (!isAdmin) return;
      mode = nextMode;
      editId = item ? item.id : null;

      if (nextMode === 'vehicle') {
        formHeading.textContent = item ? '車種を編集' : '車種を追加・管理';
        dynamicForm.innerHTML = `
          <div class="field"><label>メーカー</label><input name="maker" value="${esc(item?.maker || 'TOYOTA')}" /></div>
          <div class="field"><label>車種名 *</label><input name="name" required value="${esc(item?.name || '')}" /></div>
          <div class="field"><label>型式・仕様</label><input name="code" value="${esc(item?.code || '')}" /></div>
        `;
      } else if (nextMode === 'aero') {
        formHeading.textContent = item ? 'エアロを編集' : 'エアロをアップ';
        const opts = db.vehicles
          .map(
            (v) =>
              `<option value="${v.id}" ${(item?.vehicleId || selectedVehicleId) === v.id ? 'selected' : ''}>${esc(v.name)}</option>`
          )
          .join('');
        dynamicForm.innerHTML = `
          <div class="field"><label>対象車種 *</label><select name="vehicleId" required>${opts}</select></div>
          <div class="field"><label>パーツ名 *</label><input name="name" required value="${esc(item?.name || '')}" /></div>
          <div class="field"><label>部位（FRONT / SIDE / REARなど）</label><input name="position" value="${esc(item?.position || '')}" /></div>
          <div class="field"><label>価格</label><input name="price" value="${esc(item?.price || '')}" /></div>
          <div class="field"><label>素材・備考</label><input name="material" value="${esc(item?.material || '')}" /></div>
          <div class="field"><label>画像URL</label><input name="image" value="${esc(item?.image || '')}" /></div>
          <div class="field"><label>説明</label><textarea name="desc" rows="2">${esc(item?.desc || '')}</textarea></div>
        `;
      } else if (nextMode === 'car') {
        formHeading.textContent = item ? 'デモカーを編集' : 'デモカーをアップ';
        dynamicForm.innerHTML = `
          <div class="field"><label>デモカー名 *</label><input name="name" required value="${esc(item?.name || '')}" /></div>
          <div class="field"><label>スペック・型式</label><input name="spec" value="${esc(item?.spec || '')}" /></div>
          <div class="field"><label>画像URL</label><input name="image" value="${esc(item?.image || '')}" /></div>
          <div class="field"><label>説明</label><textarea name="desc" rows="2">${esc(item?.desc || '')}</textarea></div>
        `;
      } else if (nextMode === 'hero') {
        formHeading.textContent = 'トップ文言・背景';
        dynamicForm.innerHTML = `
          <div class="field"><label>サブ見出し</label><input name="kicker" value="${esc(db.hero.kicker)}" /></div>
          <div class="field"><label>メインタイトル</label><input name="title" value="${esc(db.hero.title)}" /></div>
          <div class="field"><label>説明文</label><textarea name="desc" rows="3">${esc(db.hero.desc)}</textarea></div>
          <div class="field"><label>背景画像URL（任意）</label><input name="bgUrl" value="${esc(db.hero.bgUrl || '')}" /></div>
        `;
      } else if (nextMode === 'pass') {
        formHeading.textContent = 'パスワード変更';
        dynamicForm.innerHTML = `
          <div class="field"><label>新しいパスフレーズ *</label><input name="newPass" type="text" required value="${esc(db.passphrase || DEFAULT_PASS)}" /></div>
        `;
      }

      formModal.classList.add('open');
    }

    document.getElementById('btnAddCar').addEventListener('click', () => openModal('car'));
    document.getElementById('btnAddVehicle').addEventListener('click', () => openModal('vehicle'));
    document.getElementById('btnAddAero').addEventListener('click', () => {
      if (!db.vehicles.length) {
        alert('先に「+ 車種を追加・管理」から車種を追加してください');
        return;
      }
      openModal('aero');
    });
    document.getElementById('btnEditHero').addEventListener('click', () => openModal('hero'));
    document.getElementById('btnChangePass').addEventListener('click', () => openModal('pass'));
    document.getElementById('formCancel').addEventListener('click', () => formModal.classList.remove('open'));

    dynamicForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isAdmin || !mode) return;
      const data = Object.fromEntries(new FormData(dynamicForm).entries());

      if (mode === 'vehicle') {
        if (editId) db.vehicles = db.vehicles.map((v) => (v.id === editId ? { ...v, ...data } : v));
        else {
          const id = 'v_' + Date.now();
          db.vehicles.push({ id, ...data });
          selectedVehicleId = id;
        }
      } else if (mode === 'aero') {
        if (editId) db.aeros = db.aeros.map((a) => (a.id === editId ? { ...a, ...data } : a));
        else db.aeros.push({ id: 'a_' + Date.now(), ...data });
        selectedVehicleId = data.vehicleId;
      } else if (mode === 'car') {
        if (editId) db.cars = db.cars.map((c) => (c.id === editId ? { ...c, ...data } : c));
        else db.cars.push({ id: 'c_' + Date.now(), ...data });
      } else if (mode === 'hero') {
        db.hero = { ...db.hero, ...data };
      } else if (mode === 'pass') {
        if (data.newPass && data.newPass.trim()) {
          db.passphrase = data.newPass.trim();
        }
      }

      formModal.classList.remove('open');
      await saveCloud();
    });

    window.editEntry = function (kind, id) {
      if (!isAdmin) return;
      const item = kind === 'car' ? db.cars.find((c) => c.id === id) : db.aeros.find((a) => a.id === id);
      if (item) openModal(kind, item);
    };

    window.deleteEntry = async function (kind, id) {
      if (!isAdmin || !confirm('削除して全員の画面に反映しますか？')) return;
      if (kind === 'car') db.cars = db.cars.filter((c) => c.id !== id);
      else if (kind === 'aero') db.aeros = db.aeros.filter((a) => a.id !== id);
      await saveCloud();
    };

    loadCloud();
  </script>
</body>
</html>
